<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- 차체 외곽 (둥근 사각형) - 빨간색 배경 -->
  <rect x="16" y="8" width="32" height="48" rx="8" ry="8" 
        fill="rgba(255, 100, 100, 0.3)" 
        stroke="currentColor" 
        stroke-width="3"/>
  
  <!-- 앞유리 (위쪽 사다리꼴) - 진한 빨간색 -->
  <path d="M22 16 L42 16 L38 26 L26 26 Z" 
        fill="rgba(255, 100, 100, 0.6)" 
        stroke="currentColor" 
        stroke-width="2.5"/>
  
  <!-- 뒷유리 (아래쪽 사다리꼴) - 진한 빨간색 -->
  <path d="M26 38 L38 38 L42 48 L22 48 Z" 
        fill="rgba(255, 100, 100, 0.6)" 
        stroke="currentColor" 
        stroke-width="2.5"/>
  
  <!-- 왼쪽 헤드라이트 -->
  <circle cx="20" cy="12" r="3" 
          fill="rgba(255, 255, 200, 0.8)" 
          stroke="currentColor" 
          stroke-width="2.5"/>
  
  <!-- 오른쪽 헤드라이트 -->
  <circle cx="44" cy="12" r="3" 
          fill="rgba(255, 255, 200, 0.8)" 
          stroke="currentColor" 
          stroke-width="2.5"/>
  
  <!-- 왼쪽 사이드미러 - 선만 -->
  <rect x="12" y="22" width="4" height="6" rx="2" 
        fill="rgba(255, 100, 100, 0.3)" 
        stroke="currentColor" 
        stroke-width="2.5"/>
  
  <!-- 오른쪽 사이드미러 - 선만 -->
  <rect x="48" y="22" width="4" height="6" rx="2" 
        fill="rgba(255, 100, 100, 0.3)" 
        stroke="currentColor" 
        stroke-width="2.5"/>
</svg>
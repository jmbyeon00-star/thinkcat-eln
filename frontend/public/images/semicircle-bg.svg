<svg width="320" height="500" viewBox="0 0 320 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" style="stop-color:#d4d4d8; stop-opacity:1.0" />
      <stop offset="100%" style="stop-color:#f9fafb; stop-opacity:0.4" />
    </linearGradient>
  </defs>

  <!-- 배경 -->
  <rect width="500" height="500" fill="url(#bgGradient)" />

  <!-- 중심 가이드 (왼쪽 끝으로 이동) -->
  <line x1="0" y1="0" x2="0" y2="500" stroke="#d4d4d8" stroke-width="1" stroke-dasharray="5,5" opacity="0.4"/>

<!-- 반원들 (X좌표 -250 이동) -->


<path d="M 0,10 A 240,240 0 0,1 240,250 A 240,240 0 0,1 0,490"
      fill="#a1a1aa" stroke="#a1a1aa" stroke-width="2" opacity="0.3" />
<path d="M 0,90 A 160,160 0 0,1 160,250 A 160,160 0 0,1 0,410"
      fill="#71717a" stroke="#71717a" stroke-width="2" opacity="0.5" />
<path d="M 0,170 A 80,80 0 0,1 80,250 A 80,80 0 0,1 0,330"
      fill="#3f3f46" stroke="#3f3f46" stroke-width="2" opacity="0.7" />

  <!-- 중심점 -->
  <circle cx="0" cy="250" r="4" fill="#3f3f46" opacity="0.5"/>
</svg>
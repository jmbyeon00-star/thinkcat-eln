<?xml version="1.0" encoding="UTF-8"?>
<svg width="640" height="140" viewBox="0 0 640 140" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="IPFORCE wordmark">
  <title>IPFORCE</title>
  <desc>IPFORCE 워드마크 — IP는 파란색, FORCE는 다크그레이, 띄어쓰기 없이</desc>
  <defs>
    <style>
      .word { font: 700 96px "Inter", "Poppins", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; letter-spacing: 0px; }
    </style>
  </defs>

  <!-- 투명 배경 -->
  <rect width="640" height="140" fill="transparent"/>

  <!-- 워드마크 -->
  <g transform="translate(20,102)">
    <!-- 한 줄 텍스트 -->
    <text class="word" y="0">
      <tspan fill="#1E5AA8">IP</tspan><tspan fill="#3F3F3F">FORCE</tspan>
    </text>
  </g>
</svg>

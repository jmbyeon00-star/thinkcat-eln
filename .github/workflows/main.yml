name: CI/CD - IPFORCE

on:
  push:
    branches: [ main ]

jobs:
  # 1) CI
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ---------- Frontend ----------
      - name: Setup Node for frontend
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install and Build (frontend)
        working-directory: ./frontend
        run: |
          npm ci
          npm run build

      # ---------- Backend ----------
      - name: Setup Python for backend
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies (backend)
        working-directory: ./backend
        run: |
          pip install -r requirements.txt

      # 테스트가 아직 불안정하면 아래 중 택1:
      # (선호1) continue-on-error로 명확하게
      - name: Run tests (backend)
        working-directory: ./backend
        continue-on-error: true
        run: |
          pytest

  # 2) CD
  deploy:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          # port 쓰면 추가:
          # port: ${{ secrets.SSH_PORT }}
          script: |
            set -euo pipefail

            # ====== 설정 ======
            DEPLOY_PATH="${{ secrets.DEPLOY_PATH }}"   # 예: /home/ipforce
            REPO_URL="${{ secrets.REPO_URL }}"         # 예: git@github.com:ORG/REPO.git
            REPO_DIR="${{ secrets.REPO_DIR }}"         # 예: ipforce_next
            BRANCH="main"

            # 서버 최상단(=DEPLOY_PATH)에 이미 존재하는 .env를 사용한다는 전제
            ENV_SRC="${DEPLOY_PATH}/.env"
            ENV_DST="${DEPLOY_PATH}/${REPO_DIR}/.env"

            echo ">>> DEPLOY_PATH=${DEPLOY_PATH}"
            echo ">>> REPO_DIR=${REPO_DIR}"
            echo ">>> BRANCH=${BRANCH}"

            # ====== 필수값 체크 ======
            if [ -z "${DEPLOY_PATH}" ] || [ -z "${REPO_URL}" ]; then
              echo "ERROR: DEPLOY_PATH or REPO_URL is empty. Check GitHub Secrets."
              exit 1
            fi

            # ====== 폴더 준비 ======
            mkdir -p "${DEPLOY_PATH}"
            cd "${DEPLOY_PATH}"

            # ====== 최초 clone / 이후 강제 동기화 ======
            if [ ! -d "${REPO_DIR}/.git" ]; then
              echo ">>> 최초 배포: git clone"
              rm -rf "${REPO_DIR}"
              git clone -b "${BRANCH}" "${REPO_URL}" "${REPO_DIR}"
            else
              echo ">>> 기존 배포: fetch + reset --hard"
              cd "${REPO_DIR}"
              git fetch origin
              git reset --hard "origin/${BRANCH}"
              git clean -fd
              cd ..
            fi

            # ====== .env 연결 (중요) ======
            if [ ! -f "${ENV_SRC}" ]; then
              echo "ERROR: env file not found: ${ENV_SRC}"
              echo "Create it on the server (do NOT commit .env to git)."
              exit 1
            fi

            # 레포 폴더에 .env가 없으면 심볼릭 링크로 연결(항상 최신으로 유지)
            ln -sf "${ENV_SRC}" "${ENV_DST}"
            echo ">>> Linked env: ${ENV_DST} -> ${ENV_SRC}"

            # ====== Docker 배포 ======
            cd "${DEPLOY_PATH}/${REPO_DIR}"

            echo ">>> Docker compose up -d --build"
            docker compose up -d --build

            echo ">>> (선택) 미사용 이미지 정리"
            docker image prune -f

            echo ">>> 배포 완료!"

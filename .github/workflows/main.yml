name: CI/CD - GPU TEST ONLY

on:
  push:
    branches: [ main ]

jobs:
  # 앞의 CI(test) 단계를 완전히 삭제하고 바로 배포(deploy)만 실행합니다.
  deploy_gpu:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy GPU Backend to Dev Server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.DEV_SERVER_IP }}   # 125.141.113.2
          username: ${{ secrets.DEV_SERVER_USER }} # yckim
          key: ${{ secrets.DEV_SERVER_KEY }}   # cat ~/.ssh/id_rsa 내용
          port: ${{ secrets.DEV_SERVER_PORT }} # 7001
          script: |
            set -euo pipefail

            # 1. 경로 설정 (반드시 서버의 실제 경로와 일치하는지 확인하세요)
            GPU_DEPLOY_PATH="/home/yckim/production"
            REPO_DIR="ipforce"

            echo ">>> 개발 서버 내 GPU 서버(운영용) 업데이트 시작"
            
            mkdir -p "${GPU_DEPLOY_PATH}"
            cd "${GPU_DEPLOY_PATH}"

            # 2. 코드 업데이트 로직
            if [ ! -d "${REPO_DIR}/.git" ]; then
              echo ">>> 최초 배포: clone 진행"
              git clone -b main ${{ secrets.REPO_URL }} "${REPO_DIR}"
            else
              echo ">>> 기존 폴더 존재: 코드 동기화"
              cd "${REPO_DIR}"
              git fetch origin
              git reset --hard origin/main
              git clean -fd
            fi

            # 3. Docker 실행
            cd "${GPU_DEPLOY_PATH}/${REPO_DIR}"
            
            echo ">>> GPU 컨테이너 빌드 및 재시작"
            # docker-compose.prod.yml 파일 내에 gpu_backend 서비스가 정의되어 있어야 합니다.
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build gpu_backend

            echo ">>> 미사용 이미지 정리"
            docker image prune -f
            
            echo ">>> GPU 서버 업데이트 완료"

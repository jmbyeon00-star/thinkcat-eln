name: GPU Server Update

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    # 핵심: ubuntu-latest 대신 self-hosted를 적습니다. 
    # 그러면 GitHub이 이 명령을 당신의 GPU 서버로 보냅니다.
    runs-on: self-hosted 

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Update GPU Backend
        run: |
          cd ~/production/ipforce_next
          # 이미 서버 안에서 실행되므로 git pull만 하면 끝!
          git fetch origin
          git reset --hard origin/main
          docker compose -f docker-compose.yml up -d --build gpu_backend
          docker image prune -f

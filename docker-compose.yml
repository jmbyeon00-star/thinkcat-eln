name: thinkcat-eln

services:
  gpu:
    tty: true
    stdin_open: true
    build:
      context: .
      dockerfile: ./Dockerfile
    container_name: thinkcat-eln_gpu
    restart: always
    env_file:
      - ./.env
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    ports:
      - "8009:8008"
    volumes:
      - ./gpu_backend:/app
      - /home/thinkcat/docker/elnfiles:/home/thinkcat/docker/elnfiles:ro
    command: >
      uvicorn app.main:app
      --host 0.0.0.0 --port 8008
      --workers ${UVICORN_WORKERS:-1}
      ${UVICORN_RELOAD:+--reload --reload-dir /app}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  vllm:
    image: vllm/vllm-openai:latest
    container_name: thinkcat-eln_vllm
    restart: always
    env_file:
      - ./.env
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      HUGGING_FACE_HUB_TOKEN: ${HF_TOKEN}
    ports:
      - "8010:8000"
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface
    command: >
      --model ${VLLM_MODEL:-google/gemma-4-12b-it}
      --dtype float16
      --max-model-len 8192
      --gpu-memory-utilization 0.6
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    profiles:
      - vllm

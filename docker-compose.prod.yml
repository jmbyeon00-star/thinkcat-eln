services:
  frontend:
    build:
      context: .
      dockerfile: ./Dockerfile.frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: "https://ipforce.co.kr"
    # container_name: ipforce_frontend
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      TZ: Asia/Seoul
      NODE_ENV: production
      NEXTAUTH_SECRET: ipforce_secret
      NEXTAUTH_URL: https://ipforce.co.kr
    volumes:
      # 운영에서는 보통 소스 볼륨 마운트 제거(권장)
      # - ./frontend:/app
      # - /app/.next
      # - /app/node_modules
      - /etc/localtime:/etc/localtime:ro
    # depends_on:
      # - backend
    command: sh -c "npm install && npm run build && npm start"
    restart: always
    networks:
      - ipforce_net

  # ==========================
  # ⚙️ BACKEND (FastAPI)
  # ==========================
  backend:
    build: 
      context: .
      dockerfile: ./Dockerfile.backend
    # container_name: ipforce_backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      TZ: Asia/Seoul
      ENV: "prod"
    #   DB_HOST: db
    #   DB_PORT: 3306
    #   DB_USER: ipforce_user
    #   DB_PASSWORD: ipforce_pass!2025
    #   DB_NAME: ipforce
    volumes:
      - ./backend:/app
      - /etc/localtime:/etc/localtime:ro
    # depends_on:
    #   - db
    restart: always
    networks:
      - ipforce_net

